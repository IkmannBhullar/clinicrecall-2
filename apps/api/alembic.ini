# Alembic configuration.
#
# Alembic owns the `public` schema — every application table (SPEC §3.1). It must never touch
# Supabase's `auth` schema, which GoTrue manages itself; migrations/env.py enforces that by
# filtering non-public schemas out of autogenerate.
#
# Note there is no sqlalchemy.url here on purpose. The connection string comes from DATABASE_URL
# via app.core.config, so there is one source of truth for it and no chance of a stale URL in a
# config file pointing migrations at the wrong database.

[alembic]
script_location = migrations

# Migration filenames get a timestamp prefix so `ls migrations/versions` reads in chronological
# order. Without this, files sort by random revision hash and the history is unreadable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

# Timestamps in migration filenames use UTC, so they stay consistent regardless of who generates
# them or what timezone their laptop is in.
timezone = UTC

[post_write_hooks]
# Format newly generated migrations with ruff so they match the rest of the codebase and do not
# fail `make lint` the moment they are created.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
