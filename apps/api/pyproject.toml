[project]
name = "clinicrecall-api"
version = "0.1.0"
description = "ClinicRecall API — patient annual-visit recall for medical practices."

# Pinned to 3.12 per SPEC section 3. uv downloads and manages this interpreter itself, so the
# version of Python already on your machine does not matter.
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- Web framework -----------------------------------------------------------------------
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "python-multipart>=0.0.20",       # required by FastAPI to accept file uploads (CSV import)

    # --- Data layer --------------------------------------------------------------------------
    "sqlalchemy>=2.0.36,<2.1",        # 2.x typed ORM style (Mapped[] / mapped_column)
    "psycopg[binary]>=3.2,<4",        # Postgres driver; [binary] avoids needing local libpq
    "alembic>=1.14,<2",               # owns the `public` schema; never touches Supabase's auth.*

    # --- Validation & settings ---------------------------------------------------------------
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",        # backs pydantic's EmailStr, used heavily by CSV import

    # --- Dates -------------------------------------------------------------------------------
    # SPEC section 3 forbids hand-rolled date math. relativedelta handles "+12 months" including
    # the Feb 29 -> Feb 28 case, which is exactly the kind of bug we must not write ourselves.
    "python-dateutil>=2.9,<3",

    # --- Auth --------------------------------------------------------------------------------
    # PyJWT ships PyJWKClient, which fetches and caches Supabase's public signing keys.
    "pyjwt[crypto]>=2.10,<3",

    # --- HTTP client -------------------------------------------------------------------------
    # Used to call the Supabase admin API when seeding demo users.
    "httpx>=0.28,<0.29",

    # --- Rate limiting -----------------------------------------------------------------------
    # SPEC section 9 explicitly says do not hand-roll this.
    "slowapi>=0.1.9,<0.2",

    # --- Templating --------------------------------------------------------------------------
    "jinja2>=3.1,<4",                 # renders the reminder email (HTML + plain text)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<0.13",
    "mypy>=1.14,<2",
    "types-python-dateutil>=2.9",
    "time-machine>=2.16,<3",          # freezes "today" so status-band tests are not flaky
]

# =============================================================================================
# uv
# =============================================================================================

[tool.uv]
# This is an application, not a library — nothing ever imports `clinicrecall-api` from PyPI.
# Telling uv so skips building and installing the project into its own virtualenv, which
# removes a build step (and a class of build errors) from `make setup`.
package = false

# =============================================================================================
# ruff — lint + format (SPEC section 3)
# =============================================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
# Excluded explicitly rather than relying on ruff's .gitignore handling, which only applies
# inside a git working tree — the checks must behave the same in CI, in a tarball, or anywhere.
exclude = [
    ".venv",                  # third-party code; not ours to lint
    "migrations/versions",    # generated by Alembic
]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear — catches real bugs, e.g. mutable default arguments
    "UP",        # pyupgrade — keeps syntax modern
    "N",         # pep8 naming
    "SIM",       # simplification
    "RUF",       # ruff's own rules
    "DTZ",       # flake8-datetimez: bans naive datetime.now(), which SPEC 5.3 depends on
    "T20",       # flake8-print: no stray print() in application code
]
ignore = [
    "E501",      # line length is enforced by the formatter, not the linter
    "B008",      # FastAPI's Depends() in defaults is the framework's own idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts freely and print for debugging; seed/CLI scripts are meant to print.
"tests/*" = ["T20"]
"app/seed/*" = ["T20"]
"app/cli/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"

# =============================================================================================
# mypy — strict on the two layers SPEC section 3 names
# =============================================================================================

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
ignore_missing_imports = true

# Strict everywhere it is checked. `make typecheck` points mypy at app/services and app/schemas,
# which are the layers where a type error would mean a wrong clinical-workflow decision.
strict = true
exclude = ["\\.venv"]

# =============================================================================================
# pytest
# =============================================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "db: test requires a live PostgreSQL database",
    "slow: test takes more than a second",
    "integration: test talks to the live Supabase stack (skips cleanly if it is not running)",
]
